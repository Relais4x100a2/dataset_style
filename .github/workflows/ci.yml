name: CI

on:
  push:
    branches: [main, deploy/caprover-relais4]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v2
        with:
          args: "check ."
      - uses: astral-sh/ruff-action@v2
        with:
          args: "format --check ."
