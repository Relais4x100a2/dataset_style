name: CI

on:
  push:
    branches: [main, deploy/caprover-relais4]
  pull_request:
    branches: [main, deploy/caprover-relais4]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v2
        with:
          args: "check ."
      - uses: astral-sh/ruff-action@v2
        with:
          args: "format --check ."

  pytest:
    runs-on: ubuntu-latest
    needs: ruff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -q
