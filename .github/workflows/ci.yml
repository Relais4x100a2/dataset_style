name: CI

on:
  push:
    branches: [main, deploy/caprover-relais4]
  pull_request:
    branches: [main, deploy/caprover-relais4]

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - uses: astral-sh/ruff-action@248b6d6da365ac08f8a75f97a45e47c1f9d193d2 # v2
        with:
          args: "check ."
      - uses: astral-sh/ruff-action@248b6d6da365ac08f8a75f97a45e47c1f9d193d2 # v2
        with:
          args: "format --check ."
      - name: Run tests
        run: pytest -q
