name: CI

on:
  push:
    branches: [main, deploy-caprover-relais4]
  pull_request:
    branches: [main, deploy-caprover-relais4]

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    env:
      DATASET_STYLE_REGRESSION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/regression_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regression_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regression_test"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - uses: astral-sh/ruff-action@248b6d6da365ac08f8a75f97a45e47c1f9d193d2 # v2
        with:
          args: "check ."
      - uses: astral-sh/ruff-action@248b6d6da365ac08f8a75f97a45e47c1f9d193d2 # v2
        with:
          args: "format --check ."
      - name: Run tests
        run: pytest -q --junitxml=junit-report.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit-report.xml
