[project]
name = "dataset-style"
version = "0.1.0"
description = "Dataset Style Studio — curation et export pour fine-tuning stylistique"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.2",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "streamlit>=1.56.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "main.py", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E501"]
# Chaînes françaises longues et blocs Streamlit
"src/ui_components.py" = ["E501"]
"src/database.py" = ["E501"]
"src/db_startup.py" = ["E501"]
"src/auth.py" = ["E501"]
"src/llm_generate.py" = ["E501"]
"src/flash_messages.py" = ["E501"]
"src/api_errors.py" = ["E501"]
"tests/test_api_errors.py" = ["E501"]
