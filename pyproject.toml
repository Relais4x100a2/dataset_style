[project]
name = "dataset-style"
version = "0.1.0"
description = "Dataset Style Studio — curation et export pour fine-tuning stylistique"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.27.0",
    "pandas>=3.0.2",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "streamlit>=1.56.0",
    "uvicorn[standard]>=0.32.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "main.py", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
markers = [
    "postgres_regression: persistance PostgreSQL (issue-009 / matrice issue-004); nécessite DATASET_STYLE_REGRESSION_DATABASE_URL.",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E501"]
# Chaînes françaises longues et blocs Streamlit
"src/ui_components.py" = ["E501"]
"src/database.py" = ["E501"]
"src/db_startup.py" = ["E501"]
"src/auth.py" = ["E501"]
"src/llm_generate.py" = ["E501"]
"src/flash_messages.py" = ["E501"]
"src/api_errors.py" = ["E501"]
"src/bff_spike_app.py" = ["E501"]
"tests/test_api_errors.py" = ["E501"]
"src/webapp/*.py" = ["E501"]
"tests/test_webapp_curator_ai.py" = ["E501"]
